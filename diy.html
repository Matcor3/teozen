<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teo Zen | Workshop</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* --- OVERRIDE STILE PROGETTAZIONE --- */
        :root {
            --font-titles: 'Space Mono', monospace;
            --font-body: 'Space Mono', monospace;
            --blueprint-blue: #003366;
            --blueprint-line: rgba(255, 255, 255, 0.15);
            --safety-yellow: #FFD700;
            --white: #ffffff;
        }

        body {
            background-color: var(--blueprint-blue);
            background-image: 
                linear-gradient(var(--blueprint-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--blueprint-line) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--white);
            font-family: var(--font-body);
        }

        /* --- NAV & HEADER --- */
        nav { background: #002244; border-bottom: 2px solid var(--safety-yellow); }
        nav a { font-family: var(--font-body); color: var(--safety-yellow) !important; text-decoration: none; font-weight: bold; }
        
        .container {
            max-width: 1200px;
            margin: 120px auto 50px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-family: var(--font-titles);
            font-size: 3.5rem;
            text-transform: uppercase;
            border: 4px solid var(--white);
            display: inline-block;
            padding: 10px 30px;
            margin-bottom: 50px;
            background: rgba(0,0,0,0.2);
            transform: rotate(-2deg); 
        }

        .page-desc {
            font-family: 'Space Mono', monospace;
            color: var(--safety-yellow);
            max-width: 700px;
            margin: 0 auto 60px auto;
            border-left: 2px solid var(--safety-yellow);
            padding-left: 15px;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* --- GRIGLIA PROGETTI --- */
        .blueprint-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
            text-align: left;
        }

        .tech-card {
            border: 2px solid var(--white);
            background: rgba(0, 51, 102, 0.8);
            position: relative;
            transition: all 0.3s;
        }

        .tech-card:hover {
            transform: translateY(-5px);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            border-color: var(--safety-yellow);
        }

        .tech-img-box {
            height: 250px;
            border-bottom: 2px solid var(--white);
            overflow: hidden;
            cursor: zoom-in;
        }

        .tech-img {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(100%);
            transition: 0.5s ease;
        }

        /* Effetto hover pulito (senza filtro blu) */
        .tech-card:hover .tech-img {
            filter: grayscale(0%);
        }

        .tech-info { padding: 20px; }
        .tech-title { font-size: 1.5rem; color: var(--safety-yellow); margin: 0; text-transform: uppercase; }
        .tech-desc { font-size: 0.9rem; color: #ddd; margin-top: 10px; }

        /* --- LIGHTBOX (Stile Art Gallery) --- */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.95); /* Bianco come Art Gallery */
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            cursor: default;
            object-fit: contain;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    </style>
</head>
<body>

    <nav>
        <ul><li><a href="index.html">/// MAIN_TERMINAL</a></li></ul>
    </nav>

    <div class="container">
        <h1>PROTOTYPE LAB</h1>
        <p class="page-desc">
            /// SYSTEM LOG: ACTIVE <br>
            Sono sempre alla ricerca di nuove sfide. Il DIY per me non è solo un hobby, ma una risposta concreta a un bisogno reale. <br><br>
            Il mio motto: “Non spendere più di quanto costerebbe nuovo in negozio.”
        </p>

        <div class="blueprint-grid" id="diy-container">
            <!-- I progetti vengono inseriti qui da JS -->
        </div>
    </div>

    <!-- Struttura Lightbox -->
    <div id="lightbox" class="lightbox">
        <img id="lightbox-img" src="" alt="Ingrandimento">
    </div>

    <script src="data.js"></script>
<script>
    const container = document.getElementById('diy-container');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    const diyProjects = allProjects.filter(item => item.category === 'diy');

    diyProjects.forEach((item, index) => {
        const projectID = `PRJ-0${index + 1}`;
        
        // LOGICA LINK VIDEO: 
        // Se esiste item.videoUrl, crea un tag <a>, altrimenti solo testo <h3>
        const titleContent = item.videoUrl 
            ? `<a href="${item.videoUrl}" target="_blank" style="color: var(--safety-yellow); text-decoration: underline;">${item.title}</a>`
            : item.title;

        container.innerHTML += `
            <div class="tech-card">
                <div class="tech-img-box">
                    <img src="${item.image}" class="tech-img" alt="${item.title}">
                </div>
                <div class="tech-info">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
                        <h3 class="tech-title">${titleContent}</h3>
                        <span style="font-size:0.7rem; color:#ccc; white-space: nowrap; margin-left: 10px;">${projectID}</span>
                    </div>
                    <p class="tech-desc">${item.description}</p>
                </div>
            </div>
        `;
    });

    // Gestione Lightbox (Invariata)
    container.addEventListener('click', (e) => {
        if (e.target.classList.contains('tech-img')) {
            lightboxImg.src = e.target.src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
    });

    lightbox.addEventListener('click', (e) => {
        if (e.target !== lightboxImg) { 
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    });
</script>
</body>
</html>
